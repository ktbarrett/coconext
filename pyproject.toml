[build-system]
requires = [
    "scikit-build-core>=0.4.3",
    "find_libpython",
    "nanobind>=1.3.2",
    "setuptools-git-versioning>=3.0,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "coconext"
description = "Features for future versions of cocotb"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [
    "LICENSE"
]
authors = [
    {name = "Kaleb Barrett", email = "dev.ktbarrett@gmail.com"},
]
maintainers = [
    {name = "Kaleb Barrett", email = "dev.ktbarrett@gmail.com"},
]
dependencies = [
    # For finding the libpython on the system so the GPI can preload it before
    # embedding the Python interpreter.
    "find_libpython",
    # Backport of Python 3.11's ExceptionGroups that are thrown by TaskManager.
    "exceptiongroup; python_version < '3.11'",
    # For assertion rewriting, `raises` and `warns` context managers,
    # `RaisesExc` and `RaisesGroup` test expected errors,
    # `skip` and `xfail` functions for ending tests early,
    # and for pytest plugin and test running functionality.
    # Assertion rewriting interface changed in version 6.
    "pytest >= 6",
]
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Framework :: cocotb",
]
dynamic = ["version"]

[project.scripts]
cocotb-config = "cocotb_tools.config:main"
coconext-config = "coconext_tools.config:main"

[project.urls]
Repository = "https://github.com/ktbarrett/coconext.git"
Issues = "https://github.com/ktbarrett/coconext/issues"

[tool.setuptools]
# Rely solely on the package_data entries in setup.py to avoid discovering
# "packages" like `cocotb._vendor` which we don't want to be found.
include-package-data = false

[tool.setuptools-git-versioning]
enabled = true
version_file = "VERSION"
count_commits_from_version_file = true
dev_template = "{tag}.dev{ccount}+r{sha}"
dirty_template = "{tag}.dev{ccount}+r{sha}.dirty"

[tool.scikit-build]
experimental = true
cmake.source-dir = "."
cmake.version = ">=3.20"
build-dir = "build"
cmake.args = []
build.verbose = false
wheel.packages = [
    "python/cocotb",
    "python/cocotb_tools",
    "python/pygpi",
    "python/coconext",
    "python/coconext_tools",
]

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = true

[tool.scikit-build.metadata.version]
provider = "setuptools_git_versioning.scikit_metadata"

[tool.towncrier]
    package = "cocotb"
    directory = "docs/source/newsfragments"
    filename = "docs/source/release_notes.rst"
    issue_format = ":pr:`{issue}`"
    # The first underline is used for the version/date header,
    # the second underline for the subcategories (like 'Features')
    underlines = ["=", "-"]
    all_bullets = false

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Deprecations and Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "change"
        name = "Changes"
        showcontent = true

[tool.ruff]
extend-exclude = [
    "docs/source/conf.py",
    "makefiles",
    "venv",
    "_vendor",
    "python/_pycoconext.pyi",
]
target-version = "py39"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "I",        # isort
    "UP",       # pyupgrade
    "PL",       # pylint
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "C4",       # flake8-comprehension
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "ISC",      # implicit string concat
    "TC",       # flake8-typechecking
    "PTH",      # flake8-use-pathlib
    "B",        # flake8-bugbear
    "BLE",      # flake8-blind-except
    "T10",      # flake8-debugger
    "EXE",      # flake8-executable
    "DTZ",      # flake8-datetimez
    "YTT",      # flake8-2020
    "SLOT",     # flake8-slots
    "PERF",     # perflint
    "SIM103",   # return the condition directly
    "SIM300",   # yoda conditions
    "RUF100",   # unused noqa
    "RUF101",   # redirected noqa
    "RUF010",   # explicit type conversion in f-string
    "RUF005",   # collection literal concatenation
    "RUF022",   # unsorted __all__
    "RUF023",   # unsorted __slots__
    "PYI030",   # unnecessary literal union
    "PT010",    # pytest.raises without an Exception type argument
    "PT031",    # pytest.warns should be single statement
    "TRY201",   # `raise exc` instead of plain `raise`
    "TRY401",   # logging with exception instead of `log.exception`
    "S102",     # use of `exec`
    "S110",     # try-except-pass
    "S112",     # try-except-continue
]
ignore = [
    "E741",    # ambiguous variable name (preference)
    "E501",    # line too long (preference)
    "PLR0912", # Too many branches (>12) (preference)
    "PLR0913", # Too many arguments to function call (>5) (preference)
    "PLR0915", # Too many statements (>50) (preference)
    "PLR0917", # Too many positional args (>5) (preference)
    "PLR2004", # Magic value used in comparison (preference)
    "PLW0603", # Using the global statement (preference)
    "PLR0911", # Too many return statements (preference)
    "PLW1641", # __eq__ without __hash__ (mypy compatibility)
    # The following 3 are ignored because sphinx doesn't set TYPE_CHECKING,
    # so it would fail to resolve any names imported in those blocks
    "TC001",   # typing-only first party import
    "TC002",   # typing-only third party import
    "TC003",   # typing-only standard library import
    "PTH123",  # Path.open() over open() (preference)
    "PTH207",  # Path.glob() over glob.glob() (preference)
    "LOG004",  # Use of log.exception outside exception handler (bad assumption)
    "B010",    # Do not call `setattr` with constant value (mypy compatibility)
    "B011",    # Do not `assert False` (pytest/cocotb test compatibility)
    "PERF203", # try-except in loop (not an issue Python > 3.11)
]

[tool.ruff.lint.isort]
known-first-party = [
    "cocotb",
    "cocotb_tools",
    "coconext",
    "coconext_tools",
    "pygpi",
]
known-third-party = [
    "pytest",
]
required-imports = ["from __future__ import annotations"]

[tool.cibuildwheel]
# Build for supported platforms only.
#
# - CPython on Linux x86_64 with glibc
# - CPython on macOS x86_64 and arm64
build = "cp*-manylinux_x86_64 cp*-macosx_x86_64 cp*-macosx_arm64"

# Build with optimizations and debugging
# -O2   Enables reasonable optimizations. -O3 is unnecessary with the virtual-call-heavy code in the GPI and may bloat binary size.
# -g    Generate standard debugging info.
# -flto Enable LTO which can reduce binary size and improve inlining.
environment = {CFLAGS = "-O2 -g -flto", CPPFLAGS = "-O2 -g -flto", LDFLAGS = "-O2 -g -flto"}

# Build on a recent manylinux image with the toolchain needed by coconext.
manylinux-x86_64-image = "manylinux_2_28"
build-frontend = "build[uv]"
test-skip = "*"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --no-sanitize-rpaths --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.pytest.ini_options]
# Simulator-backed and coconext-specific suites are invoked explicitly by the
# Makefile so a plain pytest run remains simulator-independent.
testpaths = [
    "tests/pytest",
]

# Ensure that all markers used in pytests are declared (in here).
addopts = "--strict-markers"

markers = [
    "simulator_required: mark tests as needing a simulator",
    "compile: the compile step in runner-based tests",
]
# log_cli = true
# log_cli_level = DEBUG

[tool.coverage.run]
# Patches all subprocesses to automatically append coverage together.
# Used to collect coverage in pytest simulation runs.
patch = ["subprocess"]
branch = true
source = ["cocotb", "coconext", "tests"]

[tool.coverage.paths]
source = [
    "python/cocotb/",
    "*/site-packages/cocotb/",
]
coconext = [
    "python/coconext/",
    "*/site-packages/coconext/",
]

[tool.coverage.report]
omit = [
    "*/cocotb_tools/*",
    "*/coconext_tools/*",
    "*/_vendor/*",
]
exclude_lines = [
    # copy-pasted from coveragepy source
    # TODO when we can move to a newer version of coverage
    "#\\s*(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(cover|COVER)",
    "^\\s*(((async )?def .*?)?\\)(\\s*->.*?)?:\\s*)?\\.\\.\\.\\s*(#|$)",
    "if (typing\\.)?TYPE_CHECKING:",
]

[tool.codespell]
ignore-words-list = [
    "AFE",
    "Synopsys",
    "afe",
    "afile",
    "alog",
    "ccompiler",
    "datas",
    "implementors",
    "inout",
    "nam",
    "sting",
    "synopsys",
]

skip = ["*.svg"]

[tool.mypy]
python_version = "3.11"
files = [
    "python/coconext/",
    "python/coconext_tools/",
    "tests/python/pytest/test_logic.py",
    "tests/python/pytest/test_range.py",
    "tests/simulator/",
]
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
show_error_codes = true
pretty = true
allow_redefinition = true
mypy_path = "python/"

[[tool.mypy.overrides]]
module = "_pycoconext"
disable_error_code = ["override","misc"]

[[tool.mypy.overrides]]
module = "cocotb_tools.*"
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=1.18,!=1.20.*",
    "prek",
    "clang-format",
    {include-group = "dev_tests"},
]
dev_tests = [
    "ruff",
    "nanobind",
    "cmake>=3.20",
    "scikit-build-core",
    "setuptools",
    "setuptools-git-versioning>=3.0,<4",
    "coverage[toml]>=7.10",
    "pytest-cov",
    "pytest>=8.4",
    "gcovr>=8.4,!=8.5",
    "IPython",
    "pexpect",
    "psutil",
]
docs = [
    "Sphinx ~= 8.2.0",
    "breathe",
    "sphinx-book-theme == 1.1.3",  # pin this to exact version to guard against any CSS changes
    "sphinx-design >= 0.6.1",
    "sphinxcontrib-svg2pdfconverter[CairoSVG]",
    "sphinxcontrib-domaintools @ git+https://github.com/ktbarrett/domaintools.git",
    "sphinxcontrib-makedomain",
    "sphinxcontrib-spelling >= 5.3.0",
    "sphinxcontrib-yowasp-wavedrom",
    "pyenchant",
    "sphinx-issues",
    "sphinx-argparse-cli",
    "towncrier",
    "IPython",
    "enum-tools[sphinx]",
    "sphinx-codeautolink",
    "sphinx-argparse",
    "sphinx-autofixture",
    "pytest",
]
docs_preview = [
    {include-group = "docs"},
    "sphinx-autobuild",
]
[tool.uv.dependency-groups]
docs = {requires-python = ">=3.11"}
