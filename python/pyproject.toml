[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
extend-select = [
    "PTH",  # flake8-use-pathlib
    "D",    # pydocstyle
]
extend-ignore = [
    "PTH123",  # open() should be replaced by Path.open() (preference)
    "D105",    # missing docstring in magic method (preference)
    "D107",    # missing docstring in __init__ (preference)
    "D203",    # missing blank line before docstring (incompatible with D211)
    "D213",    # missing newline before first line of docstring (incompatible with D212)
    # Sphinx doesn't set TYPE_CHECKING, so it must be able to resolve these imports.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"cocotb/**" = ["D"]
"cocotb_tools/**" = ["D"]
"pygpi/**" = ["D"]
