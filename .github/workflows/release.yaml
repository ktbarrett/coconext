name: Release

on:
  workflow_dispatch:
  push:
    tags:
    - '*'

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        activate-environment: "true"

    - name: Build wheels
      run: uvx cibuildwheel@4.3.5 --output-dir wheelhouse

    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ runner.os }}-${{ runner.arch }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.13"

    - uses: astral-sh/setup-uv@v10.3.3

    - name: Build sdist
      run: uv build --sdist --out-dir dist

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  test-release-wheels:
    name: Regression (wheels)
    needs: [build-wheels]
    uses: ./.github/workflows/regression-tests.yaml
    with:
      make_targets: release_test
      download_wheel_artifacts: true

  test-release-sdist:
    name: Regression (sdist)
    needs: [build-sdist]
    uses: ./.github/workflows/regression-tests.yaml
    with:
      make_targets: release_test
      download_sdist_artifacts: true

  publish:
    name: Publish to PyPI
    needs: [test-release-wheels, test-release-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - uses: actions/download-artifact@v8
      with:
        name: sdist
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
