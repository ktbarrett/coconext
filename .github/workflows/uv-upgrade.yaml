name: Upgrade locked dependencies

on:
  schedule:
    - cron: "0 0 * * 2" # every Tuesday at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade locked dependencies
    runs-on: ubuntu-latest
    steps:

    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.PR_GITHUB_APP_ID }}
        private-key: ${{ secrets.PR_GITHUB_APP_PRIV_KEY }}

    - uses: actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        activate-environment: "true"

    - name: Upgrade dependencies
      run: uv lock --upgrade

    - name: Open pull request
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: "Upgrade locked dependencies"
        title: "Upgrade locked dependencies"
        body: ""
        branch: "upgrade-locked-dependencies"
        sign-commits: true
        token: ${{ steps.app-token.outputs.token }}

    - name: Enable Auto-Merge
      if: steps.cpr.outputs.pull-request-number
      env:
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: gh pr merge --auto --squash "$PR_URL"
